name: Rebuild official market

on:
  push:
    branches: [main]
    paths:
      - examples/extensions/makerworld-accessories.json
      - examples/extensions/makerworld-accessories.draft.md

permissions:
  contents: read

concurrency:
  group: sayall-official-market
  cancel-in-progress: true

jobs:
  rebuild:
    name: Validate and trigger sayall.app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install validator dependencies
        run: npm ci

      - name: Validate market feed
        run: npm run validate

      - name: Trigger sayall.app production deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes cf@1.0.0-beta.5 pages projects deployments create 8586ai
